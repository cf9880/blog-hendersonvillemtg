{{- /* Dark navy theme for the Hendersonville blog only, matching www.hendersonvillemtg.com (navy #08142b, yellow #facc15). Contrast (WCAG): text #fff on #13233f ~15:1; yellow links ~11:1; meta #c3cbe6 ~10:1; button #08142b on #facc15 ~12:1. */ -}}
<style>
